name: CI pipeline

on:
  push:
    branches:
      - main
      - trunk
  pull_request:
    branches:
      - main
      - trunk

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04

    steps:
      # Validates commit messages against the Conventional Commits specification
      - name: Validate commit messages
        uses: webiny/action-conventional-commits@v1.3.0

  lint:
    name: Ruff + Black
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 3.13 — splent_framework requires it
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install linters
        run: pip install ruff black==26.3.1

      - name: Lint with ruff
        run: ruff check app rosemary fakenodo

      - name: Check formatting with black
        run: black --check app rosemary fakenodo

  test:
    name: Pytest + coverage
    runs-on: ubuntu-24.04
    needs: lint

    env:
      MARIADB_ROOT_PASSWORD: uvlhub_root_password
      MARIADB_DATABASE: uvlhubdb_test
      MARIADB_TEST_DATABASE: uvlhubdb_test
      MARIADB_USER: uvlhub_user
      MARIADB_PASSWORD: uvlhub_password
      MARIADB_HOSTNAME: 127.0.0.1
      MARIADB_PORT: 3306
      FLASK_ENV: testing

    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.MARIADB_ROOT_PASSWORD }}
          MARIADB_DATABASE: ${{ env.MARIADB_DATABASE }}
          MARIADB_USER: ${{ env.MARIADB_USER }}
          MARIADB_PASSWORD: ${{ env.MARIADB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ./rosemary

      # Selenium tests need a browser grid, so they are left out of CI.
      # fakenodo's unit tests live in app/features/zenodo/tests and run here
      # too; --cov=fakenodo makes the service count in the coverage report.
      - name: Run tests with coverage
        run: >-
          pytest --ignore-glob='*selenium*'
          --cov=app --cov=fakenodo --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  fakenodo:
    name: Fakenodo image
    runs-on: ubuntu-24.04
    needs: lint

    env:
      FAKENODO_URL: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The image docker-compose.dev.yml runs. The unit tests cover the code in
      # the test job; this job checks what they cannot: that the image builds,
      # boots, answers over HTTP and keeps its data in the /data volume.
      - name: Build fakenodo image
        run: docker build -t fakenodo:ci -f docker/images/Dockerfile.fakenodo .

      - name: Smoke test the container
        shell: bash
        run: |
          api="$FAKENODO_URL/api/deposit/depositions"
          body="$RUNNER_TEMP/fakenodo-body.json"

          start() {
            docker run -d --name fakenodo_ci -p 8000:8000 -v fakenodo_ci_data:/data fakenodo:ci
          }

          # Until the server listens, docker's port proxy accepts the connection
          # and closes it; --retry-all-errors retries that "empty reply" too.
          wait_healthy() {
            curl -fsS --retry 20 --retry-delay 1 --retry-all-errors "$FAKENODO_URL/health" \
              | jq -e '.status == "ok"'
          }

          # call <expected status> <curl args...>: prints the body on success,
          # fails with the status and body on stderr otherwise.
          call() {
            local expected=$1 status
            shift
            status=$(curl -sS -o "$body" -w '%{http_code}' "$@")
            if [ "$status" != "$expected" ]; then
              echo "$* returned $status, expected $expected" >&2
              cat "$body" >&2
              return 1
            fi
            cat "$body"
          }

          start
          wait_healthy

          id=$(call 201 -X POST -H 'Content-Type: application/json' \
            -d '{"metadata": {"title": "CI smoke test"}}' "$api" | jq -er '.id')
          call 200 "$api/$id" | jq -e '.metadata.title == "CI smoke test" and .state == "unsubmitted"'
          call 200 "$api" | jq -e --argjson id "$id" 'any(.[]; .id == $id)'

          # A new container on the same volume must still see the deposition,
          # as fakenodo_data does in development across "docker compose down".
          docker rm -f fakenodo_ci
          start
          wait_healthy
          call 200 "$api/$id" | jq -e '.metadata.title == "CI smoke test"'

          call 400 -X POST "$api/$id/actions/publish" | jq -e '.message == "Minimum one file must be provided."'
          printf 'feature data' > "$RUNNER_TEMP/model.uvl"
          call 201 -X POST -F "file=@$RUNNER_TEMP/model.uvl" "$api/$id/files" | jq -e '.filename == "model.uvl"'
          doi=$(call 202 -X POST "$api/$id/actions/publish" | jq -er '.doi')
          call 200 "$api/$id" | jq -e --arg doi "$doi" '.state == "done" and .doi == $doi and .conceptdoi != null'

          call 204 -X DELETE "$api/$id"
          call 404 "$api/$id" | jq -e '.message == "Deposition not found"'

      - name: Show fakenodo logs
        if: failure()
        run: docker logs fakenodo_ci

  build:
    name: Build Docker image
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same build as CD_dockerhub.yml, without the push
      - name: Build Docker image
        run: docker build -t uvlhub:ci -f docker/images/Dockerfile.prod .
