name: Issue label bot

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Classify
        run: |
          echo "Clasificando: ${{ github.event.issue.title }}"
          ./scripts/classify.sh "${{ github.event.issue.body }}"
      - uses: someone/auto-labeler@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "Gracias, hemos etiquetado la issue.",
            });
