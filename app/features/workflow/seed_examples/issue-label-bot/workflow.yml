name: Issue label bot

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Classify
        run: |
          echo "Clasificando: ${{ github.event.issue.title }}"
          ./scripts/classify.sh "${{ github.event.issue.body }}"
      - uses: someone/auto-labeler@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
